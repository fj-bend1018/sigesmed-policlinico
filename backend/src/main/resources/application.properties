spring.application.name=sigesmed-api
server.port=${SIGESMED_SERVER_PORT:8081}

# Las credenciales se obtienen exclusivamente del entorno del proceso.
spring.datasource.url=${SIGESMED_DB_URL}
spring.datasource.username=${SIGESMED_DB_USERNAME}
spring.datasource.password=${SIGESMED_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m

# La vigencia no aparece definida en Avance 2; 30 minutos es el valor técnico
# inicial configurable, no un criterio de aceptación documentado.
sigesmed.auth.recovery-ttl=${SIGESMED_RECOVERY_TTL:PT30M}
sigesmed.cita.plazo-cancelacion=${SIGESMED_CITA_PLAZO_CANCELACION:PT2H}
sigesmed.frontend-origin=${SIGESMED_FRONTEND_ORIGIN:http://localhost:4200}
