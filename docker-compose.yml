services:
  postgres:
    image: postgres:17
    container_name: sigesmed-postgres
    environment:
      POSTGRES_DB: sigesmed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sigesmed_pgdata:/var/lib/postgresql/data

volumes:
  sigesmed_pgdata:
