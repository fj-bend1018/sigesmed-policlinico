# Aplicación MVC heredada. La API PostgreSQL del Paso 1 está en backend/.
# Se conservan los ajustes heredados mediante variables de entorno; no guardar
# credenciales reales aquí ni en el repositorio.
spring.application.name=PoliclinicoSagradoCorazon-legacy
server.port=${SIGESMED_LEGACY_SERVER_PORT:8082}
spring.datasource.url=${SIGESMED_LEGACY_DB_URL}
spring.datasource.username=${SIGESMED_LEGACY_DB_USERNAME}
spring.datasource.password=${SIGESMED_LEGACY_DB_PASSWORD}
spring.datasource.driver-class-name=${SIGESMED_LEGACY_DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.mail.host=${SIGESMED_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SIGESMED_MAIL_PORT:587}
spring.mail.username=${SIGESMED_MAIL_USERNAME:}
spring.mail.password=${SIGESMED_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SIGESMED_MAIL_HOST:smtp.gmail.com}
